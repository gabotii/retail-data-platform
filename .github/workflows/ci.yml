name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & types
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install --require-hashes -r requirements-dev.lock && pip install --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    name: Tests (unit + integration on PostgreSQL)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: retail
          POSTGRES_PASSWORD: retail_ci_pw
          POSTGRES_DB: retail_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U retail -d retail_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://retail:retail_ci_pw@localhost:5432/retail_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install --require-hashes -r requirements-dev.lock && pip install --no-deps -e .
      - name: pytest
        run: pytest --cov --cov-report=term --cov-report=xml --cov-fail-under=85
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml

  docker:
    name: Docker stack smoke test
    runs-on: ubuntu-24.04
    needs: [lint, test]
    env:
      API_KEY: ci-smoke-key
      PIPELINE_INTERVAL_SECONDS: "60"
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker compose build
      - name: Start stack
        run: docker compose up -d
      - name: Smoke test
        run: python3 scripts/smoke_test.py --api-key "$API_KEY" --timeout 600
      - name: Incremental run (one more simulated day)
        run: |
          SIM_DAYS=61 docker compose up -d
          sleep 90
          curl -fsS "http://localhost:8000/api/v1/pipeline/runs?limit=5"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: docker compose down -v
